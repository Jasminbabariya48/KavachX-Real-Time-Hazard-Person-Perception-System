[project]
name = "kavachx"
version = "1.0.0"
description = "Real-Time Hazard & Person Perception on Qualcomm Hexagon HTP DSP"
authors = [{ name = "KavachX Team" }]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python-headless>=4.5.0"
]
